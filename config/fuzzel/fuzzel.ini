[main]
font=JetBrainsMono NF SemiBold:size=11
use-bold=yes
dpi-aware=no
fields=name,generic,comment,categories,filename,keywords,exec
terminal=foot
prompt="󰣇 => "
placeholder=""
icon-theme=kora
icons-enabled=yes
show-actions=no
anchor=center
