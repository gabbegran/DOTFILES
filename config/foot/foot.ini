# -*- conf -*-

[main]
# Reduced opacity (0.0 to 1.0). 0.7 is a good "middle" transparency.
alpha=0.7

[colors-dark]
# The core Black & White palette
background=000000
foreground=ffffff

## Normal colors (Mapped to White/Light Gray)
regular0=242424  # black
regular1=ffffff  # white
regular2=ffffff  # white
regular3=ffffff  # white
regular4=ffffff  # white
regular5=ffffff  # white
regular6=ffffff  # white
regular7=e6e6e6  # light gray

## Bright colors (Mapped to Pure White/Gray)
bright0=616161   # gray
bright1=ffffff   # bright white
bright2=ffffff   # bright white
bright3=ffffff   # bright white
bright4=ffffff   # bright white
bright5=ffffff   # bright white
bright6=ffffff   # bright white
bright7=ffffff   # pure white

[cursor]
# White cursor with black text inside
color=000000 ffffff
style=block
blink=yes

[csd]
# Matches the window decorations to the dark theme
color=ffffff
button-color=000000
